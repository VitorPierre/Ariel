# Configuração de persistência do Ariel.
# modo=memoria  -> como é hoje: tudo em listas na memória, nada de banco (padrão se este arquivo não existir).
# modo=mysql    -> liga no banco abaixo. Exige o driver mysql-connector-j numa pasta lib/ no classpath
#                  (não incluído no projeto — baixe em dev.mysql.com/downloads/connector/j).
modo=memoria

mysql.host=localhost
mysql.porta=3306
mysql.banco=mydb
mysql.usuario=root
mysql.senha=
